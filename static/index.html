<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Stack Password Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Secure Password Generator</h1>
        
        <div class="display-container">
            <input type="text" id="password-display" readonly placeholder="Generating...">
            <button id="copy-btn" aria-label="Copy to clipboard">Copy</button>
        </div>

        <div class="metrics">
            <span id="strength-badge" class="badge">Strength: -</span>
            <span id="entropy-badge" class="badge">Entropy: - bits</span>
        </div>

        <div class="controls">
            <label for="length-slider">Length: <span id="length-val">16</span></label>
            <input type="range" id="length-slider" min="6" max="16" value="16">
        </div>

        <button id="generate-btn">Generate Password</button>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
